name: CI

on:
  push:
    branches: [ main, develop, 'docs/**' ]
  pull_request:
    branches: [ main, develop, 'docs/**' ]

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classifier.outputs.docs_only }}
      reason: ${{ steps.classifier.outputs.reason }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Classify workflow mode
      id: classifier
      env:
        EVENT_NAME: ${{ github.event_name }}
        BEFORE_SHA: ${{ github.event.before }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        CURRENT_SHA: ${{ github.sha }}
      run: |
        if [ "$EVENT_NAME" = "pull_request" ]; then
          BASE_REF="$BASE_SHA"
          HEAD_REF="$HEAD_SHA"
        else
          BASE_REF="$BEFORE_SHA"
          HEAD_REF="$CURRENT_SHA"
        fi

        if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          echo "reason=no comparable base sha; running full ci" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        CHANGED_FILES="$(git diff --name-only "$BASE_REF" "$HEAD_REF")"

        if [ -z "$CHANGED_FILES" ]; then
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          echo "reason=no changed files detected; running full ci" >> "$GITHUB_OUTPUT"
        elif echo "$CHANGED_FILES" | grep -Eqv '^(README\.md|docs/|public/|resources/|vercel\.json$)'; then
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          echo "reason=non-docs files changed" >> "$GITHUB_OUTPUT"
        else
          echo "docs_only=true" >> "$GITHUB_OUTPUT"
          echo "reason=docs-only file changes" >> "$GITHUB_OUTPUT"
        fi

  test:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint

    - name: Run unit tests
      run: npm run test:unit:run

    - name: Build library
      run: npm run build

  deploy_docs_vercel:
    needs: classify
    if: needs.classify.outputs.docs_only == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install Vercel CLI
      run: npm install -g vercel@latest

    - name: Pull Vercel project settings
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

    - name: Deploy docs to Vercel
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"

  release:
    needs: [classify, test]
    runs-on: ubuntu-latest
    if: needs.classify.outputs.docs_only != 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: write
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        registry-url: 'https://registry.npmjs.org'

    - name: Update npm for trusted publishing
      run: npm install -g npm@^11.5.1

    - name: Install dependencies
      run: npm ci

    - name: Determine release version
      id: release
      run: |
        LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
        if [ -n "$LAST_TAG" ]; then
          COMMITS="$(git log --format=%B "$LAST_TAG"..HEAD)"
        else
          COMMITS="$(git log --format=%B HEAD)"
        fi

        if printf '%s\n' "$COMMITS" | grep -Eiq 'BREAKING CHANGE|^[a-z]+(\([^)]+\))?!:'; then
          BUMP=major
        elif printf '%s\n' "$COMMITS" | grep -Eiq '^feat(\([^)]+\))?:'; then
          BUMP=minor
        elif printf '%s\n' "$COMMITS" | grep -Eiq '^fix(\([^)]+\))?:'; then
          BUMP=patch
        else
          echo "publish=false" >> "$GITHUB_OUTPUT"
          echo "No feat, fix, or breaking-change commit found."
          exit 0
        fi

        CURRENT_VERSION="$(node -p "require('./package.json').version")"
        NEXT_VERSION="$(node -e '
          const [major, minor, patch] = process.argv[1].split(".").map(Number)
          const bump = process.argv[2]
          if (bump === "major") process.stdout.write(`${major + 1}.0.0`)
          else if (bump === "minor") process.stdout.write(`${major}.${minor + 1}.0`)
          else process.stdout.write(`${major}.${minor}.${patch + 1}`)
        ' "$CURRENT_VERSION" "$BUMP")"

        echo "publish=true" >> "$GITHUB_OUTPUT"
        echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
        echo "Publishing @gspa/ui@$NEXT_VERSION ($BUMP release)."

    - name: Apply release version
      if: steps.release.outputs.publish == 'true'
      run: npm version "${{ steps.release.outputs.version }}" --no-git-tag-version

    - name: Publish package to npm
      if: steps.release.outputs.publish == 'true'
      run: |
        PACKAGE_VERSION="$(node -p "require('./package.json').version")"
        if npm view "@gspa/ui@$PACKAGE_VERSION" version >/dev/null 2>&1; then
          echo "@gspa/ui@$PACKAGE_VERSION is already published; skipping publish."
        else
          npm publish --access public
        fi

    - name: Commit and tag release
      if: steps.release.outputs.publish == 'true'
      run: |
        VERSION="${{ steps.release.outputs.version }}"
        git config user.email "action@github.com"
        git config user.name "GitHub Actions"
        git add package.json package-lock.json
        git commit -m "chore: release v$VERSION [skip ci]"
        git tag "v$VERSION"
        git push origin HEAD:main
        git push origin "v$VERSION"
