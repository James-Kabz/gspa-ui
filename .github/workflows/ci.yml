name: CI

on:
  push:
    branches: [ main, develop, 'docs/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop, 'docs/**' ]

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classifier.outputs.docs_only }}
      reason: ${{ steps.classifier.outputs.reason }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Classify workflow mode
      id: classifier
      env:
        EVENT_NAME: ${{ github.event_name }}
        BEFORE_SHA: ${{ github.event.before }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        CURRENT_SHA: ${{ github.sha }}
      run: |
        if [ "$EVENT_NAME" = "pull_request" ]; then
          BASE_REF="$BASE_SHA"
          HEAD_REF="$HEAD_SHA"
        else
          BASE_REF="$BEFORE_SHA"
          HEAD_REF="$CURRENT_SHA"
        fi

        if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          echo "reason=no comparable base sha; running full ci" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        CHANGED_FILES="$(git diff --name-only "$BASE_REF" "$HEAD_REF")"

        if [ -z "$CHANGED_FILES" ]; then
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          echo "reason=no changed files detected; running full ci" >> "$GITHUB_OUTPUT"
        elif echo "$CHANGED_FILES" | grep -Eqv '^(README\.md|docs/|public/|resources/|vercel\.json$)'; then
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          echo "reason=non-docs files changed" >> "$GITHUB_OUTPUT"
        else
          echo "docs_only=true" >> "$GITHUB_OUTPUT"
          echo "reason=docs-only file changes" >> "$GITHUB_OUTPUT"
        fi

  test:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint

    - name: Run unit tests
      run: npm run test:unit:run

    - name: Build library
      run: npm run build

  deploy_docs_vercel:
    needs: classify
    if: needs.classify.outputs.docs_only == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install Vercel CLI
      run: npm install -g vercel@latest

    - name: Pull Vercel project settings
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

    - name: Deploy docs to Vercel
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"

  release:
    needs: [classify, test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        registry-url: 'https://registry.npmjs.org'

    - name: Update npm for trusted publishing
      run: npm install -g npm@^11.5.1

    - name: Install dependencies
      run: npm ci

    - name: Build library
      run: npm run build

    - name: Verify release tag matches package version
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        PACKAGE_VERSION="$(node -p "require('./package.json').version")"
        test "$TAG_VERSION" = "$PACKAGE_VERSION"

    - name: Publish package to npm
      run: |
        PACKAGE_VERSION="$(node -p \"require('./package.json').version\")"
        if npm view "@gspa/ui@$PACKAGE_VERSION" version >/dev/null 2>&1; then
          echo "@gspa/ui@$PACKAGE_VERSION is already published; skipping publish."
        else
          npm publish --access public
        fi
